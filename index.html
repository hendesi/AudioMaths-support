<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="app-icon.png" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <title>PilotApps Support</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background-color: #FFFAF0;
      color: #333;
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }

    /* App Icon Styling */
    .app-icon {
      width: 128px;
      height: 128px;
      border-radius: 28px;
      object-fit: cover;
      margin: 0;
      display: block;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    }

    .app-icons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    @media (max-width: 600px) {
      .app-icon {
        width: 96px;
        height: 96px;
      }
    }

    .container {
      max-width: 700px;
      background: white;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    /* center all child elements horizontally */
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      /* all text centered by default */
    }

    h1 {
      color: #E9631A;
      text-align: center;
      margin-bottom: 0.5rem;
    }

    h2 {
      color: #EFC18F;
      margin-top: 1.5rem;
    }

    a.button {
      display: inline-block;
      background-color: #E9631A;
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      margin-top: 1rem;
    }

    a.button.secondary {
      background-color: #ffffff;
      color: #E9631A;
      margin-top: 2rem;
    }

    footer {
      text-align: center;
      font-size: 0.85rem;
      color: #666;
      margin-top: 2rem;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- 👇 App Icons -->
    <div class="app-icons" aria-label="PilotApps iOS apps">
      <img src="app-icon.png" alt="Audio Maths App Icon" title="Audio Maths" class="app-icon" />
      <img src="triangle-test-icon.png" alt="Triangle Test App Icon" title="Triangle Test" class="app-icon" />
    </div>

    <h1>Support</h1>
    <p>Welcome! This is the support page for <strong>Triangle Test</strong> and <strong>Audio Maths</strong>. If you have questions, issues, feedback, or found a bug, please
      reach out:</p>

    <a href="mailto:pilotapps.help@gmail.com" class="button">Email Support</a>

    

    <footer>
      <div class="footer-links">
        <a href="audioMaths-privacy.html" class="button secondary">Audio Maths Privacy Policy</a>
        <a href="triangleTest-privacy.html" class="button secondary">Triangle Test Privacy Policy</a>
      </div>
      <p>© 2025 Felix Desiderato. All rights reserved.</p>
    </footer>
  </div>
</body>

</html>
